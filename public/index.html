<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f9ff">
<title>Hub Karyawan</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portal Hub">
<link rel="stylesheet" href="/style.css?v=16">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><button class="icon-btn" id="topback" aria-label="Kembali ke Beranda" hidden></button><img class="logo" src="/logo.jpg" onerror="this.onerror=null;this.src='/logo.jpg'" width="28" height="28" alt=""><h1 id="title">Beranda</h1></div>
    <div class="top-r"><button class="icon-btn" id="bell" aria-label="Belum dibaca"></button><button class="icon-btn" id="meBtn" aria-label="Profil"></button></div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <section id="chat" hidden></section>
  <section id="detail" hidden></section>
  <div id="sheet" hidden></div>
  <section id="login" hidden></section>
  <section id="splash" aria-label="Memuat Portal Hub">
    <div class="sp-in">
      <p class="sp-hi"></p>
      <div class="sp-logo"><span class="sp-ring"></span><span class="sp-ring r2"></span><div class="lgc"><img src="/logo-mark.png" alt="Mjs Group"></div></div>
      <h1 class="sp-name">Mjs Group</h1>
      <p class="sp-sub">Portal Hub Employee</p>
      <p class="sp-txt"></p>
    </div>
    <div class="sp-foot"><span>MEKAR JAYA SENTOSA</span><i></i><span>PORTAL HUB <b>1.0</b></span></div>
    <div class="sp-bar"><i></i></div>
  </section>
</div>
<script src="/app.js?v=16"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
</body>
</html>
